actions:
  - name: Add-on ServiceAccount exists
    bashTest:
      script: |
        set -euo pipefail
        kubectl -n "${NAMESPACE}" get serviceaccount "${APP_SERVICE_ACCOUNT}" >/dev/null

  - name: Add-on ConfigMap exposes Preflight contract
    bashTest:
      script: |
        set -euo pipefail
        config_json="$(kubectl -n "${NAMESPACE}" get configmap "${APP_CONFIGMAP}" -o json)"
        printf '%s' "${config_json}" | jq -e --arg image "${APP_RUNTIME_IMAGE}" '.data.runnerImage == $image' >/dev/null
        printf '%s' "${config_json}" | jq -e '.data.supportedModes | contains("phase2a_only")' >/dev/null
        printf '%s' "${config_json}" | jq -e '.data.supportedModes | contains("full")' >/dev/null
        printf '%s' "${config_json}" | jq -e '.data.GBX_IPFTO_PROJECTS_DIR == "/data/projects"' >/dev/null
        printf '%s' "${config_json}" | jq -e '.data.GBX_OUTPUT_ROOT == "/data/output"' >/dev/null
        printf '%s' "${config_json}" | jq -e '.data.GBX_INPUT_ROOT == "/data/input"' >/dev/null

  - name: Tester sees Marketplace image wiring
    bashTest:
      script: |
        set -euo pipefail
        test -n "${APP_RUNTIME_IMAGE}"
        test -n "${APP_TESTER_IMAGE}"
        case "${APP_RUNTIME_IMAGE}" in
          us-docker.pkg.dev/*/glassbox-ipfto*) ;;
          *) echo "Unexpected IP/FTO runtime image: ${APP_RUNTIME_IMAGE}" >&2; exit 1 ;;
        esac

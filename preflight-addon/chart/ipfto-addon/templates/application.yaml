{{- if .Values.application.enabled }}
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ include "glassbox-ipfto-addon.fullname" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "glassbox-ipfto-addon.labels" . | nindent 4 }}
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"qzC12XfQZs","product_id":"glassbox-bio-molecular-ip-fto-screening","partner_name":"Glassbox Bio"}'
spec:
  descriptor:
    type: glassbox-ipfto-addon
    version: {{ .Chart.AppVersion | quote }}
    description: Install-time add-on resources for exposing IP/FTO in an existing Preflight deployment.
    maintainers:
      - name: Glassbox Bio
    keywords:
      - ipfto
      - preflight
      - addon
      - patent landscape
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  addOwnerRef: true
  componentKinds:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
{{- end }}

nameOverride: ""
fullnameOverride: ""

image:
  repository: us-docker.pkg.dev/glassbox-bio-public/glassbox-bio-molecular-ip-fto-screening/glassbox-ipfto
  tag: "1.0.0"
  digest: "sha256:b2e8690c52a866a174bea75b1a08f4f2ba2f5799daef47d7d8126a82ceeddff6"
  pullPolicy: IfNotPresent

install:
  serviceAccountName: gbx-ipfto-runner
  configMapName: gbx-ipfto-addon
  projectsDir: /data/projects
  outputRoot: /data/output
  inputRoot: /data/input
  supportedModes:
    - phase2a_only
    - full
  blockedModes: []
  serviceAccountAnnotations: {}

configData:
  GBX_ENTITLEMENT_URL: ""
  GBX_ENTITLEMENT_AUDIENCE: ""
  GBX_MARKETPLACE_METADATA_JSON: ""
  # Full mode requires one of OPENAI_API_KEY, OPENROUTER_API_KEY,
  # ANTHROPIC_API_KEY, GEMINI_API_KEY, or GOOGLE_API_KEY from a real Secret.
  secretRefs: []

serviceAccount:
  create: true

application:
  enabled: true

apptest:
  enabled: false
  image:
    repository: us-docker.pkg.dev/glassbox-bio-public/glassbox-bio-molecular-ip-fto-screening/glassbox-ipfto/preflight-addon-tester
    tag: "1.0.0"
    digest: "sha256:e64458ccf280dd66e94bedfecf322ed83639c41ffe6653293c30a08066e425b7"
    pullPolicy: Always
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "250m"
      memory: 256Mi

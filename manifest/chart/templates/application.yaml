{{- if .Values.application.enabled }}
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ include "glassbox-ipfto-screening.fullname" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "glassbox-ipfto-screening.labels" . | nindent 4 }}
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"qzC12XfQZs","product_id":"glassbox-bio-molecular-ip-fto-screening","partner_name":"Glassbox Bio"}'
spec:
  descriptor:
    type: glassbox-ipfto-screening
    version: {{ .Chart.AppVersion | quote }}
    description: Customer-hosted Glassbox IP/FTO screening runtime for standalone and add-on execution.
    maintainers:
      - name: Glassbox Bio
    keywords:
      - ip
      - freedom-to-operate
      - patent landscape
      - kubernetes
  selector:
    matchLabels:
      {{- include "glassbox-ipfto-screening.selectorLabels" . | nindent 6 }}
  addOwnerRef: true
  componentKinds:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ServiceAccount
    - group: batch
      kind: Job
{{- end }}

{{- if .Values.apptest.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "glassbox-ipfto-screening.fullname" . }}-apptest
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "glassbox-ipfto-screening.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "pods", "pods/log", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "glassbox-ipfto-screening.fullname" . }}-apptest
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "glassbox-ipfto-screening.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "glassbox-ipfto-screening.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "glassbox-ipfto-screening.fullname" . }}-apptest
{{- end }}
